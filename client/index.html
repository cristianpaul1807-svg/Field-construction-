<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Logiciel - Construction</title>

    <!-- Installed to a home screen, these are what keep the app in its own
         window. Without apple-mobile-web-app-capable, iOS relaunches it
         inside Safari on every reload — which is exactly what it was doing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Field" />
    <!-- The .ico is first because that is the one a browser reaches for when
         it ignores everything else, and the one a bookmark bar uses. -->
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS never reads the manifest for its home-screen icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!--
      El panel no carga ninguna fuente web: va con la del sistema, que es la que
      ya está en el teléfono y no cuesta una ida a Google antes de pintar. Aquí
      había un ejemplo de Google Fonts comentado que venía de la plantilla, y
      leerlo hacía creer que el panel iba en Inter cuando nunca lo hizo.

      Si algún día se pone una, `comprobar-ancho-panel.mjs` empieza a exigir que
      cargue antes de medir: un ancho medido con la letra de reserva no es el
      que se ve.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Aquí vivía una etiqueta de analítica con %VITE_ANALYTICS_ENDPOINT% sin
         sustituir: Vite sólo reemplaza las variables que existen, y esa nunca
         se configuró. El navegador pedía literalmente "/umami", recibía el
         index, e intentaba ejecutarlo como JavaScript: un error en la consola
         en cada carga de cada pantalla. Cuando queramos analítica, se pone con
         su endpoint de verdad. -->
  </body>

</html>
